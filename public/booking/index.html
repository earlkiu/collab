<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book your session — Earl Kiu</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://use.typekit.net/pur8tye.css">
<style>
  :root {
    --n100: #F2F0ED; --n200: #DDDAD6; --n400: #7A7672;
    --n600: #1E1C1A; --n700: #100F0D;
    --font: 'artifex-hand-cf', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--n100); color: var(--n700);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
  h1 { font-size: 1.75rem; font-weight: 400; margin: 0 0 .75rem; letter-spacing: -.01em; }
  p { color: var(--n600); line-height: 1.6; margin: 0 0 2.5rem; max-width: 34rem; }
  #cal-inline { width: 100%; min-height: 40rem; overflow: auto; }
  #frame { display: none; }
  #frame iframe { width: 100%; min-height: 46rem; border: 1px solid var(--n200); background: #fff; }
  .note { color: var(--n400); font-size: .9rem; margin-top: 2.5rem; }
</style>
</head>
<body>
<main>
  <h1 id="h">Pick a date</h1>
  <p id="lede">Choose a day that works. The agreement comes straight after — nothing is confirmed until it is signed.</p>

  <div id="cal-inline"></div>
  <div id="frame"></div>

  <p class="note" id="note"></p>
</main>

<script>
  // The Notion session id arrives on the link Earl sends.
  var SESSION = new URLSearchParams(location.search).get('s') || '';
  if (SESSION) sessionStorage.setItem('collab_session', SESSION);
  else SESSION = sessionStorage.getItem('collab_session') || '';

  var h = document.getElementById('h');
  var lede = document.getElementById('lede');
  var note = document.getElementById('note');

  if (!SESSION) {
    note.textContent =
      'This link looks incomplete. Reply to the email you received and Earl will send a new one.';
  }

  function fail(text) {
    h.textContent = 'Something went wrong';
    lede.textContent = text;
    document.getElementById('cal-inline').style.display = 'none';
  }

  // Cal's success redirect is a paid feature. The embed's client-side event is
  // not, so the agreement is swapped in here rather than on another page.
  async function onBooked(uid) {
    document.getElementById('cal-inline').style.display = 'none';
    h.textContent = 'One moment';
    lede.textContent = 'Preparing your agreement.';

    if (!SESSION) {
      fail('Your date is held, but we could not match it to your enquiry. Reply to Earl\u2019s email and he will sort it out.');
      return;
    }

    try {
      var res = await fetch('/.netlify/functions/create-contract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s: SESSION, uid: uid || '' })
      });
      if (!res.ok) throw new Error('bad response');
      var data = await res.json();
      if (!data.signUrl) throw new Error('no url');

      h.textContent = 'Read this properly';
      lede.textContent = 'It is short, and it is written to be understood rather than skimmed. Your date is held until you sign — nothing else is needed after this.';

      var wrap = document.getElementById('frame');
      var f = document.createElement('iframe');
      f.src = data.signUrl + '?embedded=yes';
      wrap.appendChild(f);
      wrap.style.display = 'block';
    } catch (e) {
      fail('Your date is held. Reply to Earl\u2019s email and he will sort this out.');
    }
  }
</script>

<script type="text/javascript">
  (function (C, A, L) {
    let p = function (a, ar) { a.q.push(ar); };
    let d = C.document;
    C.Cal = C.Cal || function () {
      let cal = C.Cal; let ar = arguments;
      if (!cal.loaded) {
        cal.ns = {}; cal.q = cal.q || [];
        d.head.appendChild(d.createElement("script")).src = A;
        cal.loaded = true;
      }
      if (ar[0] === L) {
        const api = function () { p(api, arguments); };
        const namespace = ar[1];
        api.q = api.q || [];
        if (typeof namespace === "string") {
          cal.ns[namespace] = cal.ns[namespace] || api;
          p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]);
        } else p(cal, ar);
        return;
      }
      p(cal, ar);
    };
  })(window, "https://app.cal.com/embed/embed.js", "init");

  Cal("init", "collab", { origin: "https://app.cal.com" });
  Cal.ns.collab("inline", {
    elementOrSelector: "#cal-inline",
    calLink: "earlkiu/book-collab",
    config: { layout: "month_view" }
  });
  Cal.ns.collab("ui", { hideEventTypeDetails: false, layout: "month_view" });

  // Fires in the browser the moment the booking is taken. The payload shape has
  // moved between Cal versions, so dig for the uid rather than trusting one path.
  Cal.ns.collab("on", {
    action: "bookingSuccessful",
    callback: function (e) {
      var d = (e && e.detail && e.detail.data) || {};
      var b = d.booking || d;
      var uid = b.uid || b.bookingUid || d.uid || '';
      console.log('booking uid', uid);
      onBooked(uid);
    }
  });
</script>
</body>
</html>
