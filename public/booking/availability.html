<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Open dates — Earl Kiu</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://use.typekit.net/pur8tye.css">
<style>
  :root {
    --n100: #F2F0ED; --n200: #DDDAD6; --n400: #7A7672;
    --n600: #1E1C1A; --n700: #100F0D;
    --font: 'artifex-hand-cf', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--n100); color: var(--n700);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    padding: 3rem 1.25rem 5rem;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 400; margin: 0 0 .5rem; letter-spacing: -.01em; }
  .sub { color: var(--n400); font-size: .95rem; line-height: 1.5; margin: 0 0 2.5rem; }
  .month {
    font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--n400); margin: 2.25rem 0 .5rem;
  }
  .month:first-of-type { margin-top: 0; }
  .day {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--n200); padding: .85rem 0;
  }
  .day .d { font-size: 1.05rem; }
  .day .w { color: var(--n400); font-size: .9rem; }
  .day.part .d { color: var(--n600); }
  .day.part .w::after { content: ' · partly booked'; }
  .msg { color: var(--n400); line-height: 1.6; }
  footer {
    margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--n200);
    color: var(--n400); font-size: .85rem; line-height: 1.6;
  }
</style>
</head>
<body>
<main>
  <h1>Open dates</h1>
  <p class="sub" id="sub">Loading…</p>

  <div id="days"></div>

  <footer id="foot"></footer>
</main>

<script>
(function () {
  var sub = document.getElementById('sub');
  var wrap = document.getElementById('days');
  var foot = document.getElementById('foot');

  function parts(iso) {
    var d = new Date(iso + 'T00:00:00+08:00');
    var o = { timeZone: 'Asia/Kuala_Lumpur' };
    return {
      month: d.toLocaleDateString('en-GB', Object.assign({ month: 'long', year: 'numeric' }, o)),
      date: d.toLocaleDateString('en-GB', Object.assign({ day: 'numeric', month: 'short' }, o)),
      weekday: d.toLocaleDateString('en-GB', Object.assign({ weekday: 'long' }, o))
    };
  }

  fetch('/.netlify/functions/availability')
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error('bad');
      var days = res.d.days || [];

      if (!days.length) {
        sub.textContent = 'Nothing open in the next two months.';
        return;
      }

      sub.textContent = 'Dates that can still take a full session, over the next two months. Kuala Lumpur time.';

      var month = '';
      days.forEach(function (d) {
        var p = parts(d.date);

        if (p.month !== month) {
          month = p.month;
          var m = document.createElement('p');
          m.className = 'month';
          m.textContent = month;
          wrap.appendChild(m);
        }

        var row = document.createElement('div');
        row.className = 'day' + (d.clear ? '' : ' part');
        row.innerHTML = '<span class="d">' + p.date + '</span><span class="w">' + p.weekday + '</span>';
        wrap.appendChild(row);
      });

      foot.textContent = 'Nothing can be booked from this page. Once a date is agreed, Earl sends a booking link.';
    })
    .catch(function () {
      sub.textContent = 'Could not load the calendar just now. Try again in a moment.';
    });
})();
</script>
</body>
</html>
