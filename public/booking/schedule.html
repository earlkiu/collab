<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>On set</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://use.typekit.net/pur8tye.css">
<style>
  :root {
    --n100: #F2F0ED; --n200: #DDDAD6; --n400: #7A7672;
    --n600: #1E1C1A; --n700: #100F0D;
    --font: 'artifex-hand-cf', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--n100); color: var(--n700);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    padding: 2rem 1.25rem 4rem;
  }
  main { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 400; margin: 0 0 .35rem; }
  .sub { color: var(--n400); font-size: .9rem; margin: 0 0 2rem; }
  button.row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font-family: var(--font); font-size: 1.05rem; color: var(--n700);
    background: transparent; border: 0; border-top: 1px solid var(--n200);
    padding: 1rem 0; line-height: 1.35;
  }
  button.row:last-of-type { border-bottom: 1px solid var(--n200); }
  button.row .meta { display: block; color: var(--n400); font-size: .85rem; margin-top: .2rem; }
  #qr { display: none; text-align: center; padding-top: 1rem; }
  #qr canvas, #qr img { margin: 0 auto; }
  #qr .who { font-size: 1.1rem; margin-bottom: .25rem; }
  #qr .what { color: var(--n400); font-size: .9rem; margin-bottom: 1.75rem; }
  #qr a.link { display: block; margin-top: 1.75rem; color: var(--n400); font-size: .8rem; word-break: break-all; }
  #back {
    margin-top: 2.5rem; background: none; border: 0; cursor: pointer;
    font-family: var(--font); color: var(--n400); font-size: .9rem; padding: 0;
  }
  .msg { color: var(--n400); }
</style>
</head>
<body>
<main>
  <h1 id="h">On set</h1>
  <p class="sub" id="sub">Pick who you are shooting.</p>

  <div id="list"><p class="msg">Loading…</p></div>

  <div id="qr">
    <p class="who" id="qr-who"></p>
    <p class="what" id="qr-what"></p>
    <div id="qr-code"></div>
    <a class="link" id="qr-link" target="_blank" rel="noopener"></a>
    <button id="back">← Back to the list</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var KEY = new URLSearchParams(location.search).get('k') || '';
  var list = document.getElementById('list');
  var qr = document.getElementById('qr');
  var sub = document.getElementById('sub');

  if (!KEY) {
    list.innerHTML = '<p class="msg">Missing key. Use the bookmarked link.</p>';
    return;
  }

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  async function load() {
    qr.style.display = 'none';
    list.style.display = 'block';
    sub.textContent = 'Pick who you are shooting.';

    try {
      var res = await fetch('/.netlify/functions/on-set?k=' + encodeURIComponent(KEY));
      if (!res.ok) throw new Error('bad');
      var data = await res.json();

      if (!data.sessions || !data.sessions.length) {
        list.innerHTML = '<p class="msg">No sessions yet.</p>';
        return;
      }

      list.innerHTML = '';
      data.sessions.forEach(function (s) {
        var b = document.createElement('button');
        b.className = 'row';
        var bits = [];
        bits.push(s.signed ? 'Agreement signed — adds Schedule 1' : 'No agreement yet — full agreement');
        if (s.shoot) bits.push(fmt(s.shoot));
        if (s.comfort) bits.push(s.comfort);
        b.innerHTML = '<span>' + s.name + '</span><span class="meta">' + bits.join(' · ') + '</span>';
        b.onclick = function () { create(s.id); };
        list.appendChild(b);
      });
    } catch (e) {
      list.innerHTML = '<p class="msg">Could not load. Check the key and your signal.</p>';
    }
  }

  async function create(id) {
    list.innerHTML = '<p class="msg">Preparing…</p>';
    try {
      var res = await fetch('/.netlify/functions/on-set', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ k: KEY, s: id })
      });
      if (!res.ok) throw new Error('bad');
      var data = await res.json();
      if (!data.signUrl) throw new Error('no url');
      show(data);
    } catch (e) {
      list.innerHTML = '<p class="msg">Could not prepare it. Tap back and try again.</p>';
      setTimeout(load, 2500);
    }
  }

  function show(data) {
    list.style.display = 'none';
    qr.style.display = 'block';
    sub.textContent = 'Let her scan this.';

    document.getElementById('qr-who').textContent = data.name;
    document.getElementById('qr-what').textContent =
      data.kind === 'schedule'
        ? 'Schedule 1 — wardrobe and scope'
        : 'Collaboration Agreement & Model Release';

    var target = data.signUrl;
    var box = document.getElementById('qr-code');
    box.innerHTML = '';
    new QRCode(box, {
      text: target,
      width: 240,
      height: 240,
      colorDark: '#100F0D',
      colorLight: '#F2F0ED',
      correctLevel: QRCode.CorrectLevel.M
    });

    var a = document.getElementById('qr-link');
    a.href = target;
    a.textContent = target;
  }

  document.getElementById('back').onclick = load;
  load();
})();
</script>
</body>
</html>
